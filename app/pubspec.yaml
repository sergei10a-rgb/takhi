name: takhi
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.3.0+3

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.5.1
  web_socket_channel: ^3.0.1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.2.0
  convert: ^3.1.2
  takhi_protocol:
    path: ../packages/takhi_protocol

  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.1
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  qr_flutter: ^4.1.0
  # ^0.11.7 (the version `call_engine.dart` was originally written against,
  # Task 4) fails a real `flutter build apk --release` against this SDK
  # (3.44.7 / AGP 9.0.1, Task 10 Step 13) two ways in sequence: first the
  # Android v1 embedding (`PluginRegistry.Registrar`, removed from this
  # engine entirely), then -- after bumping to the last pre-1.0 release,
  # 0.14.2, which fixes that -- a hardcoded `compileSdkVersion 31` inside
  # flutter_webrtc's own `android/build.gradle` that several transitive
  # androidx artifacts now require 33/34+ for (confirmed live: neither an
  # `afterEvaluate` nor a `gradle.projectsEvaluated` override from the
  # app's own `android/build.gradle.kts` can win that race -- AGP 9 reads
  # and locks `compileSdk` earlier than either hook fires). `1.5.2` is the
  # first release that both compiles against `compileSdkVersion 36` and
  # explicitly handles AGP 9's built-in-Kotlin change (the same "Future
  # versions of Flutter will fail to build" KGP warning this build was
  # already emitting) -- confirmed against the live `flutter_webrtc`
  # source. `flutter analyze`/`flutter test` re-run clean after this bump
  # with zero code changes needed in `call_engine.dart` -- the
  # `RTCPeerConnection`/`MediaStream`/`RTCIceCandidate` surface it uses
  # is unchanged across the 0.x -> 1.x jump.
  flutter_webrtc: ^1.5.2
  url_launcher: ^6.3.1
  # ^5.2.0 resolves an internally-inconsistent transitive combo --
  # `record_linux 0.7.2` (the newest version matching record 5.2.1's own
  # `record_linux: '>=0.5.0 <1.0.0'` constraint) implements an older
  # `record_platform_interface` ABI than the `^1.2.0` record 5.2.1 itself
  # allows pub to resolve (1.6.0), so `record_linux` fails to compile --
  # confirmed live against a real `flutter build apk --release` run
  # (Task 10 Step 13), the same "confirm the live shape" flag this plan
  # gives `flutter_webrtc`. `record: ^6.2.0` pins a self-consistent
  # `record_linux ^1.3.1` / `record_platform_interface ^1.6.0` pair
  # upstream; `AudioRecorder`/`RecordConfig`/`AudioEncoder.opus` (this
  # app's entire usage, `lib/call/voice_note_recorder.dart`) are unchanged
  # across 5.x->6.x.
  record: ^6.2.0
  audioplayers: ^6.1.0
  share_plus: ^10.1.4
  # Pure-Dart decode/resize/JPEG-encode, used by
  # `profile/driver_photo_codec.dart` to shrink a driver's portrait before it
  # is stored and, later, carried inside an encrypted offer. Deliberately not
  # a native compressor plugin (`flutter_image_compress` and friends): those
  # only run on a device, so the size ladder -- the part that decides whether
  # a photo is small enough for a relay to accept the event at all -- could
  # never be tested in `flutter test`. Already present transitively (via
  # `flutter_launcher_icons`); listing it here just makes the direct use
  # honest. MIT, so no conflict with this project's AGPL-3.0.
  image: ^4.9.1
  tflite_flutter: ^0.12.1
  # Keeps the screen awake while the taximeter is on the clock. Asked for by
  # the driver who field-tested v0.3.0: the display went dark mid-run, which
  # on this screen is not a cosmetic problem -- a dark screen is also the
  # state Android throttles location delivery in, so the meter lost distance
  # at the same time the driver lost sight of it. The GPS half is fixed
  # separately, by running the location service in the foreground
  # (AndroidManifest.xml); this package is only about the display.
  #
  # Deliberately scoped to the running meter and released the moment a run
  # ends. An app that holds the screen on for a whole shift is an app a
  # driver uninstalls after one flat battery.
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.1

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  image_picker_platform_interface: ^2.10.0
  share_plus_platform_interface: ^5.0.2
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#F4F1E9"
    theme_color: "#C99A3C"
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 256

# Native (Android) splash screen (Task 10 Step 5) -- generated once via
# `dart run flutter_native_splash:create` into
# `android/app/src/main/res/drawable*/`; light background gets the
# dark-ink horse silhouette, dark background gets the gold one, matching
# `theme/takhi_theme.dart`'s own light/dark surface colors exactly
# (`brand/BRAND.md`'s "watermark, дотоод UI-д" transparent-silhouette
# assets). Paths point at `assets/brand/` (copied from the repo root's
# `brand/out/`, same convention `assets/icon.png` already established --
# a Flutter project's pubspec-relative asset paths can't reach outside
# its own directory, so the source-of-truth PNGs are vendored here, not
# referenced via `../brand/...`) rather than the plan's literal
# `brand/out/...` path, which assumed `pubspec.yaml` could see the repo
# root directly.
flutter_native_splash:
  color: "#F4F1E9"
  image: assets/brand/takhi_horse_ink.png
  color_dark: "#211E19"
  image_dark: assets/brand/takhi_horse_gold.png
  android_12:
    color: "#F4F1E9"
    image: assets/brand/takhi_horse_ink.png
    color_dark: "#211E19"
    image_dark: assets/brand/takhi_horse_gold.png

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/fonts/
    - assets/brand/
    # MediaPipe BlazeFace (short range), Apache-2.0, ~224KB. Bundled, never
    # downloaded: the portrait check must work with no network, and a check
    # that fetched a model would leak "this driver is setting up a profile
    # right now" to whoever served it. See assets/models/LICENSE.
    - assets/models/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

  # Bundled NotoSans (OFL-1.1, Cyrillic-complete) -- takhi_theme.dart's
  # `fontFamily: 'NotoSans'` previously fell back to the platform default
  # because no font asset existed (Task 10 Step 4). As of this vendoring,
  # `google/fonts` only distributes this family as a single variable font
  # (`NotoSans[wdth,wght].ttf`, weights 100-900 in one file) rather than
  # separate static -Regular/-Bold files -- confirmed live against the
  # `google/fonts` repo before writing this block (a static `-Bold` file
  # 404s). The same file is referenced for both weight entries below;
  # Flutter/Skia selects the requested weight out of the variable font
  # automatically via `FontWeight`.
  #
  # So do NOT "fix" this by dropping in a static `-Bold` file: the name
  # says `-Regular` but the file carries a `wght` axis over 100-900, and a
  # single-weight replacement would flatten every heading in the app.
  # `test/typography_weight_test.dart` measures the rendered widths and
  # fails if that ever happens.
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 700
